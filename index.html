<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>auxvyl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#150a20;
    --bg-2:#1d0f2e;
    --panel:#20122f;
    --panel-2:#291a3c;
    --border:rgba(255,182,230,0.16);
    --text:#fbeaff;
    --muted:#c9a8de;
    --muted-2:#8f6ba8;
    --accent:#ff6fb5;
    --violet:#b57bff;
    --accent-dim:rgba(255,111,181,0.14);
    --red:#ff5f56;
    --yellow:#ffbd2e;
    --green:#27c93f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background: linear-gradient(rgba(21, 10, 32, 0.75), rgba(21, 10, 32, 0.75)), url('background.gif') no-repeat center center fixed;
    background-size: cover;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    overflow-x:hidden;
    scroll-behavior:smooth;
  }
  ::selection{background:var(--accent); color:#2a0d22;}

  /* ---------- background waves ---------- */
  #waveCanvas{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.25;
  }

  /* ---------- loading screen ---------- */
  #loader{
    position:fixed; inset:0; z-index:9999;
    background:
      radial-gradient(circle at 30% 20%, rgba(181,123,255,0.22), transparent 45%),
      radial-gradient(circle at 75% 75%, rgba(255,111,181,0.16), transparent 45%),
      #12081b;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .6s ease;
  }
  #loader::before{
    content:'';
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,182,230,0.02) 2px, rgba(255,182,230,0.02) 4px);
    pointer-events:none;
  }
  .loader-ring-wrap{position:relative; margin-bottom:2rem;}
  .loader-avatar{
    width:120px; height:120px; border-radius:50%;
    border:2px solid var(--border);
    background:linear-gradient(150deg, #24122f, #1a0d24);
    display:flex; align-items:center; justify-content:center;
    font-size:2rem; font-weight:700; color:var(--accent);
    letter-spacing:2px; font-family:'Quicksand', sans-serif;
    box-shadow:0 0 40px rgba(255,111,181,0.15);
  }
  .loader-ring{
    position:absolute; inset:-12px;
    border-radius:50%;
    border:1px solid rgba(255,111,181,0.25);
    animation:spin 6s linear infinite;
  }
  .loader-ring.r2{inset:-20px; border-color:rgba(181,123,255,0.18); animation:spin 9s linear infinite reverse;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .loader-bar-track{
    width:220px; height:2px; background:#1a1a1a; border-radius:2px; overflow:hidden;
    position:relative; z-index:1;
  }
  .loader-bar-fill{
    height:100%; width:0%; background:var(--accent);
    box-shadow:0 0 8px var(--accent);
    transition:width .08s linear;
  }
  .loader-pct{
    margin-top:.9rem; font-size:.7rem; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(255,255,255,0.35); z-index:1;
  }
  .loader-line{
    margin-top:.6rem; font-size:.65rem; color:var(--muted-2); letter-spacing:.15em;
    z-index:1; min-height:1em;
  }

  /* ---------- nav ---------- */
  nav{
    position:fixed; top:1rem; left:1rem; z-index:50;
    opacity:0; transform:translateY(-40px);
    transition:opacity .6s ease, transform .6s ease;
  }
  nav.show{opacity:1; transform:translateY(0);}
  .nav-pill{
    display:flex; align-items:center; gap:1.5rem;
    padding:.6rem 1.4rem; border-radius:999px;
    background:rgba(0,0,0,0.6); backdrop-filter:blur(20px);
    border:1px solid var(--border);
    box-shadow:0 0 20px rgba(255,111,181,0.08);
  }
  .nav-pill span{color:var(--accent); font-weight:700; font-size:.85rem;}
  .nav-pill button{
    background:none; border:none; color:#bebebe; font-family:inherit;
    font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; cursor:pointer;
    transition:color .3s ease;
  }
  .nav-pill button:hover{color:#fff;}

  /* ---------- hero ---------- */
  main{position:relative; z-index:1;}
  .hero{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:6rem 1.5rem 3rem;
  }
  .avatar-wrap{position:relative; margin-bottom:2rem; opacity:0; transform:scale(.85); transition:opacity .8s ease, transform .8s ease;}
  .avatar-wrap.show{opacity:1; transform:scale(1);}
  .avatar{
    width:144px; height:144px; border-radius:50%;
    border:2px solid var(--border); overflow:hidden;
    background:linear-gradient(150deg, #2a1436, #1a0d24);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar svg{width:70%; height:70%;}
  .avatar-ring{position:absolute; inset:-12px; border-radius:50%; border:1px solid rgba(255,111,181,0.18); animation:spin 8s linear infinite;}
  .avatar-ring.r2{inset:-20px; border-color:rgba(181,123,255,0.12); animation:spin 12s linear infinite reverse;}

  h1.handle{
    font-family:'Quicksand', sans-serif;
    font-size:clamp(2.2rem, 6vw, 3.2rem); font-weight:700; letter-spacing:.5px;
    background:linear-gradient(100deg, var(--accent), var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; transform:translateY(16px); transition:opacity .7s ease .1s, transform .7s ease .1s;
  }
  h1.handle.show{opacity:1; transform:translateY(0);}
  h1.handle .dim{background:none; -webkit-text-fill-color:var(--muted-2); color:var(--muted-2);}

  .tagline{
    margin-top:.6rem; color:var(--muted); font-size:.85rem; letter-spacing:.05em;
    opacity:0; transition:opacity .7s ease .2s;
  }
  .tagline.show{opacity:1;}

  .socials{
    display:flex; gap:.9rem; margin-top:2rem;
    opacity:0; transform:translateY(10px); transition:opacity .7s ease .3s, transform .7s ease .3s;
  }
  .socials.show{opacity:1; transform:translateY(0);}
  .social-btn{
    width:42px; height:42px; border-radius:50%;
    background:var(--panel); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:#cfcfd4; text-decoration:none;
    transition:border-color .25s ease, color .25s ease, transform .25s ease;
  }
  .social-btn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-3px);}
  .social-btn svg{width:18px; height:18px;}

  /* ---------- music player ---------- */
  .player{
    margin-top:2rem; width:min(90vw, 300px);
    display:flex; align-items:center; gap:.8rem;
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:.7rem .9rem;
    opacity:0; transform:translateY(10px); transition:opacity .7s ease .4s, transform .7s ease .4s;
  }
  .player.show{opacity:1; transform:translateY(0);}
  .player-icon{
    width:34px; height:34px; border-radius:8px;
    background:linear-gradient(135deg, var(--accent), var(--violet));
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .player-icon svg{width:18px; height:18px; fill:#000;}
  .player-body{
    flex:1; min-width:0; text-align:left;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .player-body.slide-out {
    opacity: 0;
    transform: translateY(-6px);
  }
  .player-body.slide-in {
    opacity: 1;
    transform: translateY(0);
  }
  .player-row{display:flex; justify-content:space-between; align-items:baseline; gap:.5rem;}
  .player-title{font-size:.8rem; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .player-time{font-size:.65rem; color:var(--muted-2); white-space:nowrap;}
  .player-track{margin-top:.4rem; height:3px; background:#242428; border-radius:3px; overflow:hidden;}
  .player-fill{height:100%; width:0%; background:var(--accent); box-shadow:0 0 6px var(--accent); transition: width 0.1s linear;}
  .player-play{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--border);
    background:transparent; color:#cfcfd4; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; transition:border-color .25s ease, color .25s ease;
  }
  .player-play:hover{border-color:var(--accent); color:var(--accent);}
  .player-play svg{width:12px; height:12px;}

  /* ---------- stats ---------- */
  .stats{
    display:flex; gap:.8rem; margin-top:1.6rem; flex-wrap:wrap; justify-content:center;
    opacity:0; transform:translateY(10px); transition:opacity .7s ease .5s, transform .7s ease .5s;
  }
  .stats.show{opacity:1; transform:translateY(0);}
  .stat-box{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:.7rem 1.4rem; min-width:130px;
  }
  .stat-label{font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted-2);}
  .stat-value{font-size:1.1rem; font-weight:700; margin-top:.3rem; color:#fff; letter-spacing:.5px;}
  .stat-value.accent{color:var(--accent);}

  .scroll-hint{
    margin-top:3rem; color:var(--muted-2); font-size:.65rem; letter-spacing:.2em; text-transform:uppercase;
    display:flex; flex-direction:column; align-items:center; gap:.5rem;
    opacity:0; animation:fadeInOnly 1s ease .8s forwards;
  }
  @keyframes fadeInOnly{to{opacity:1;}}
  .scroll-hint .chevron{animation:bounce 2s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}

  /* ---------- about section ---------- */
  .about{
    min-height:80vh; display:flex; flex-direction:column; align-items:center;
    padding:4rem 1.5rem 8rem;
  }
  .about h2{
    font-size:clamp(1.6rem, 4vw, 2.2rem); font-weight:700; margin-bottom:2.5rem;
    opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s ease;
  }
  .about h2.reveal{opacity:1; transform:translateY(0);}

  .terminal{
    width:min(90vw, 620px);
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    overflow:hidden;
    opacity:0; transform:translateY(30px);
    transition:opacity .8s ease, transform .8s ease;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .terminal.reveal{opacity:1; transform:translateY(0);}
  .terminal-head{
    display:flex; align-items:center; gap:.7rem;
    padding:.7rem 1rem; border-bottom:1px solid var(--border);
    background:var(--panel-2);
  }
  .dot{width:11px; height:11px; border-radius:50%;}
  .dot.red{background:var(--red);}
  .dot.yellow{background:var(--yellow);}
  .dot.green{background:var(--green);}
  .terminal-head span{color:var(--muted-2); font-size:.72rem; margin-left:.3rem;}
  .terminal-body{padding:1.6rem 1.6rem 2rem; font-size:.85rem; line-height:1.7; min-height:180px;}
  .terminal-prompt{color:var(--accent); margin-bottom:1rem;}
  .terminal-output{color:#d6d6da; white-space:pre-wrap;}
  .cursor{
    display:inline-block; width:7px; height:1em; background:var(--accent);
    margin-left:2px; vertical-align:text-bottom;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  footer{
    text-align:center; padding:2rem 1rem 3rem; color:var(--muted-2); font-size:.65rem; letter-spacing:.15em;
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
</style>
</head>

<script>
/* ================= background waves ================= */
const canvas = document.getElementById('waveCanvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let t = 0;
function drawWaves(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const lines = 5;
  for(let i=0;i<lines;i++){
    ctx.beginPath();
    const amp = 18 + i*4;
    const yBase = canvas.height*0.15 + i*(canvas.height*0.18);
    const speed = 0.004 + i*0.0006;
    for(let x=0;x<=canvas.width;x+=8){
      const y = yBase + Math.sin(x*0.006 + t*speed*40 + i) * amp;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    const hue = i % 2 === 0 ? '255,140,200' : '190,140,255';
    ctx.strokeStyle = `rgba(${hue},${0.07 + i*0.012})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  t++;
  requestAnimationFrame(drawWaves);
}
drawWaves();

/* ================= loading sequence ================= */
const loader = document.getElementById('loader');
const loaderFill = document.getElementById('loaderFill');
const loaderPct = document.getElementById('loaderPct');
const loaderLine = document.getElementById('loaderLine');
const lines = ['initializing session...','decrypting profile...','establishing connection...','loading assets...','done.'];

let pct = 0;
function tickLoader(){
  pct += Math.random()*9 + 3;
  if(pct >= 100){
    pct = 100;
    loaderFill.style.width = '100%';
    loaderPct.textContent = '100%';
    loaderLine.textContent = lines[lines.length-1];
    setTimeout(finishLoading, 350);
    return;
  }
  loaderFill.style.width = pct + '%';
  loaderPct.textContent = Math.floor(pct) + '%';
  loaderLine.textContent = lines[Math.min(Math.floor(pct/25), lines.length-2)];
  setTimeout(tickLoader, 120 + Math.random()*120);
}
setTimeout(tickLoader, 400);

function finishLoading(){
  loader.style.opacity = '0';
  setTimeout(()=> loader.style.display='none', 650);

  document.getElementById('nav').classList.add('show');
  document.getElementById('avatarWrap').classList.add('show');
  document.getElementById('handle').classList.add('show');
  document.getElementById('tagline').classList.add('show');
  document.getElementById('socials').classList.add('show');
  document.getElementById('player').classList.add('show');
  document.getElementById('stats').classList.add('show');

  attemptAutoplay();
}

/* ================= music player & playlist setup ================= */
const playlist = [
  { title: "baka bukas", src: "./baka bukas.mp3" },
  { title: "Mula Sa Malayo (Reimagined)", src: "./Mula Sa Malayo (Reimagined).mp3" }
];

let currentTrackIndex = 0;
const audio = new Audio();
audio.loop = false;

const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const trackFill = document.getElementById('trackFill');
const trackTime = document.getElementById('trackTime');
const trackTitle = document.getElementById('trackTitle');
const playerBody = document.getElementById('playerBody');

let playing = false;

function fmt(s){
  if(isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + String(sec).padStart(2,'0');
}

function setPlayingUI(isPlaying){
  playing = isPlaying;
  playIcon.innerHTML = isPlaying
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function updateProgress(){
  const current = audio.currentTime || 0;
  const dur = audio.duration || 0;
  
  if (dur > 0) {
    trackFill.style.width = Math.min(100, (current/dur)*100) + '%';
    trackTime.textContent = fmt(current) + ' / ' + fmt(dur);
  } else {
    trackFill.style.width = '0%';
    trackTime.textContent = '0:00 / 0:00';
  }
}

function loadTrack(index, autoPlay = true){
  const track = playlist[index];
  playerBody.classList.add('slide-out');

  setTimeout(() => {
    trackTitle.textContent = track.title;
    audio.src = track.src;
    audio.load();
    updateProgress();

    playerBody.classList.remove('slide-out');
    playerBody.classList.add('slide-in');
    setTimeout(() => playerBody.classList.remove('slide-in'), 300);

    if(autoPlay){
      audio.play().then(() => {
        setPlayingUI(true);
      }).catch(() => {
        // Autoplay blocked by the browser. Catching this prevents console errors
        // and safely leaves the UI in a paused state for the user to start manually.
        setPlayingUI(false);
      });
    }
  }, 250);
}

audio.addEventListener('ended', () => {
  currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
  loadTrack(currentTrackIndex, true);
});

// Update the timeline purely based on the real audio element's events
audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', updateProgress);

playBtn.addEventListener('click', ()=>{
  if(audio.paused){
    audio.play().then(()=> setPlayingUI(true)).catch(()=>{});
  } else {
    audio.pause();
    setPlayingUI(false);
  }
});

function attemptAutoplay(){
  loadTrack(currentTrackIndex, true);
}

/* ================= local time (GMT+8) ================= */
function updateClock(){
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset()*60000;
  const gmt8 = new Date(utc + 8*60*60000);
  let h = gmt8.getHours();
  const m = String(gmt8.getMinutes()).padStart(2,'0');
  const s = String(gmt8.getSeconds()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h = 12;
  document.getElementById('localTime').textContent = `${String(h).padStart(2,'0')}:${m}:${s} ${ampm}`;
}
updateClock();
setInterval(updateClock, 1000);

/* ================= view counter (persistent) ================= */
async function trackView(){
  const el = document.getElementById('viewCount');
  try{
    let current = 0;
    try{
      const existing = await window.storage.get('profile_views', true);
      current = existing ? parseInt(existing.value, 10) || 0 : 0;
    }catch(e){ current = 0; }
    current += 1;
    await window.storage.set('profile_views', String(current), true);
    el.textContent = current.toLocaleString();
  }catch(e){
    el.textContent = '1';
  }
}
trackView();

/* ================= scroll reveal: about heading + terminal ================= */
const revealTargets = [document.getElementById('aboutHeading'), document.getElementById('terminalCard')];
const io = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('reveal');
      if(entry.target.id === 'terminalCard') startTyping();
      io.unobserve(entry.target);
    }
  });
}, { threshold: 0.3 });
revealTargets.forEach(t=> io.observe(t));

/* ================= terminal typing animation ================= */
const aboutText = `> 起源: 星間宇宙
「時と共に流れる」
[The Past, The Present, The Future] 
• A change within continuum.
‿︵‿︵‿︵‿︵‿︵‿︵‿︵‿︵‿︵‿︵‿︵‿︵
「毎晩私は星を数えていました、すべての星は私があなたなしで行ったすべての秒を`;

let typed = false;
function startTyping(){
  if(typed) return;
  typed = true;
  const out = document.getElementById('typedOutput');
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';

  function type(){
    if(i <= aboutText.length){
      out.textContent = aboutText.slice(0, i);
      out.appendChild(cursor);
      i++;
      setTimeout(type, 18 + Math.random()*22);
    }
  }
  type();
}
</script>
